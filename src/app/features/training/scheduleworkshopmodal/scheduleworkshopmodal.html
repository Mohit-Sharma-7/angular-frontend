<div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity z-40 flex justify-center items-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden z-50 animate-fade-in-up">
    
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
      <h2 class="text-xl font-bold text-gray-900">Schedule Workshop</h2>
      <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Workshop Title <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="formData.title" minlength="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., Soil Testing Basics">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location / Village <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="formData.location" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., North Block Community Center">
      </div>

      <div class="flex gap-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Date & Time <span class="text-red-500">*</span></label>
          <input type="datetime-local" [(ngModel)]="formData.date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Assign Officer <span class="text-red-500">*</span></label>
          <select [(ngModel)]="formData.officerId" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option [ngValue]="null" disabled>Select an officer...</option>
            @for (officer of availableOfficers; track officer.id) {
              <option [ngValue]="officer.id">{{ officer.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="px-6 py-4 bg-gray-50 border-t flex justify-end gap-3">
      <button (click)="onCancel()" class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50">Cancel</button>
      <button (click)="onSubmit()" [disabled]="!isFormValid" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">Schedule</button>
    </div>

  </div>
</div>
