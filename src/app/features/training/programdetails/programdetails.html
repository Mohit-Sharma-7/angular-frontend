<div class="p-8 max-w-7xl mx-auto">
  <button routerLink="/programmanagerdashboard" class="flex items-center text-gray-500 hover:text-gray-700 mb-6 transition-colors text-sm font-medium">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
    Back to Programs
  </button>

  <div class="bg-white border border-gray-200 rounded-xl p-8 mb-10 shadow-sm flex justify-between items-start">
    <div class="max-w-2xl">
      <div class="flex items-center gap-3 mb-3">
        <h1 class="text-3xl font-bold text-gray-900">{{ program.title }}</h1>
        <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
          {{ program.status }}
        </span>
      </div>
      <p class="text-gray-600 text-lg leading-relaxed">{{ program.description }}</p>
    </div>
    
    <div class="bg-gray-50 p-6 rounded-lg border border-gray-100 min-w-[240px]">
      <div class="flex justify-between mb-2 text-sm">
        <span class="text-gray-500">Start Date:</span>
        <span class="font-semibold text-gray-900">{{ program.startDate | date:'M/d/yyyy' }}</span>
      </div>
      <div class="flex justify-between mb-2 text-sm">
        <span class="text-gray-500">End Date:</span>
        <span class="font-semibold text-gray-900">{{ program.endDate | date:'M/d/yyyy' }}</span>
      </div>
      <div class="flex justify-between text-sm border-t border-gray-200 pt-2 mt-2">
        <span class="text-gray-500">Total Workshops:</span>
        <span class="font-semibold text-gray-900">{{ workshops.length }}</span>
      </div>
    </div>
  </div>

  <div class="flex justify-between items-end mb-6">
    <h2 class="text-2xl font-bold text-gray-900">Scheduled Workshops</h2>
    <button (click)="openScheduleModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium flex items-center gap-2 transition-all shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
      Schedule Workshop
    </button>
  </div>

  <app-workshop-list 
    [workshops]="workshops" 
    [programTitle]="program.title">
  </app-workshop-list>

  @if (isScheduleModalOpen) {
    <app-schedule-workshop-modal 
      (close)="closeScheduleModal()" 
      (save)="handleScheduleWorkshop($event)">
    </app-schedule-workshop-modal>
  }
</div>
