<div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity z-40 flex justify-center items-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden z-50 animate-fade-in-up">
    
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
      <h2 class="text-xl font-bold text-gray-900">Create New Program</h2>
      <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Program Title <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="formData.title" minlength="3" maxlength="100" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="e.g., Sustainable Irrigation (3-100 chars)">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-red-500">*</span></label>
        <textarea [(ngModel)]="formData.description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all resize-none" placeholder="Brief description of the program goals..."></textarea>
      </div>

      <div class="flex gap-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Start Date <span class="text-red-500">*</span></label>
          <input type="date" [(ngModel)]="formData.startDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all text-gray-700">
        </div>
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">End Date <span class="text-red-500">*</span></label>
          <input type="date" [(ngModel)]="formData.endDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all text-gray-700">
        </div>
      </div>
    </div>

    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-3">
      <button (click)="onCancel()" class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 transition-colors shadow-sm">
        Cancel
      </button>
      <button (click)="onSubmit()" [disabled]="!isFormValid" class="px-5 py-2.5 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        Create Program
      </button>
    </div>

  </div>
</div>
